# Pinned Gradle distribution: the SINGLE source of truth for CI.
# The wrapper JAR is deliberately not committed; CI reads the version from
# THIS file and regenerates the wrapper from it.
# Gradle 8.13: AGP 8.13.2 requires Gradle >= 8.13; Kotlin Gradle Plugin
# 2.2.21 is the pinned Kotlin Gradle Plugin version in build.gradle.kts.
# DO NOT bump this to 9.x alone: AGP 8.13.2 uses the Gradle internal API
# `org.gradle.api.problems.internal.InternalProblems`, which was removed in
# Gradle 9.6.0, so every task fails at plugin application. Gradle 9 needs a
# coordinated AGP 9 migration (AGP -> Gradle -> Kotlin -> compileSdk).
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
